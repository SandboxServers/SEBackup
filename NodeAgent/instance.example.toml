# =============================================================================
# SEBackup Instance Configuration - Example
# =============================================================================
#
# Each Space Engineers / Torch server instance on a compute node needs a
# configuration file at: C:\SEBackup\instances\{instance_name}.toml
#
# The filename (without .toml extension) becomes the instance identifier
# used throughout SEBackup for logging, backup naming, and tracking.
#
# Instance-level settings override global defaults where applicable.
# For example, if this instance runs VRage API on port 9090 instead of
# the global default 8080, set it here and it will take precedence.
#
# Example: C:\SEBackup\instances\PvPArena.toml
# =============================================================================


# -----------------------------------------------------------------------------
# [instance] - Instance identity and metadata
# -----------------------------------------------------------------------------
[instance]

# Internal name for this instance. Should match the filename stem.
# Used as the identifier in backup manifests, logs, and directory names.
# Must be unique within a node. Use alphanumeric characters and underscores.
name = "PvPArena"

# Human-readable display name for logs, notifications, and the GUI.
display_name = "PvP Arena Server"

# Optional description for documentation purposes.
description = "24/7 PvP arena server with weekly resets"


# -----------------------------------------------------------------------------
# [torch] - Torch server installation paths
# -----------------------------------------------------------------------------
# Tells SEBackup where this Torch instance's files are located on the
# compute node's filesystem.
#
[torch]

# Absolute path to the Torch server installation directory.
# This is where Torch.Server.exe and the Instance/ folder live.
# Must be an absolute Windows path.
install_path = "C:\\TorchServers\\PvPArena"

# Path to the world save data directory.
# If not set, SEBackup will look for it at:
#   {install_path}\Instance\Saves\{world_name}
# Override this if your world data is in a non-standard location.
world_path = "C:\\TorchServers\\PvPArena\\Instance\\Saves\\PvPWorld"

# Torch configuration file path (optional).
# Defaults to {install_path}\Torch.cfg if not specified.
# config_path = "C:\\TorchServers\\PvPArena\\Torch.cfg"


# -----------------------------------------------------------------------------
# [vrage_api] - VRage Remote API connection for this instance
# -----------------------------------------------------------------------------
# Overrides the global [defaults.vrage_api] settings for this instance.
# Only include settings that differ from the global defaults.
#
[vrage_api]

# TCP port for the VRage Remote API on this instance.
# Each Torch instance typically runs on a different port.
# Must not conflict with other instances on the same node.
port = 8080

# VRage API authentication key.
# Found in the Torch server's SpaceEngineers-Dedicated.cfg file
# under the <RemoteApiKey> element.
# This key is used to authenticate save commands via the API.
key = ""

# Seconds to wait for a world save to complete.
# Override for very large worlds that take longer to save.
# Leave commented to use the global default (120 seconds).
# save_timeout_seconds = 180


# -----------------------------------------------------------------------------
# [backup] - Instance-specific backup settings
# -----------------------------------------------------------------------------
# Override global backup behavior for this specific instance.
#
[backup]

# Enable or disable backups for this instance.
# Set to false to temporarily exclude this instance from backup runs
# without removing its configuration.
enabled = true

# Backup priority when multiple instances are queued.
# "high"   - Backed up first. Use for critical production servers.
# "normal" - Default priority.
# "low"    - Backed up last. Use for test or development servers.
priority = "normal"

# Additional paths to include in the backup beyond the world save.
# Useful for backing up Torch plugins, configuration files, or logs.
# Each path is relative to the torch install_path unless absolute.
# extra_paths = ["Instance\\Plugins", "Instance\\Torch.cfg"]

# Paths to exclude from the backup (glob patterns).
# Useful for skipping large temporary files or cache directories.
# exclude_patterns = ["*.log", "Logs\\*", "*.tmp"]


# -----------------------------------------------------------------------------
# [vss] - Instance-specific VSS settings (optional)
# -----------------------------------------------------------------------------
# Override VSS shadow copy settings for this instance.
# Usually not needed unless the instance data is on a different volume.
#
# [vss]
# mount_base = "D:\\SEBackup\\vss_mount"
