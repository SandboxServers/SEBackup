# =============================================================================
# SEBackup Instance Configuration - Example
# =============================================================================
#
# Each Space Engineers / Torch server instance on a compute node needs a
# configuration file at: C:\SEBackup\instances\{instance_name}.toml
#
# The filename (without .toml extension) becomes the instance identifier
# used throughout SEBackup for logging, backup naming, and tracking.
#
# Instance-level settings override global defaults where applicable.
# For example, if this instance runs VRage API on port 9090 instead of
# the global default 8080, set it in [vrage_api] and it takes precedence.
#
# Normally you do NOT hand-write this file -- Register-Instance.ps1 generates
# it for you. It is documented here so you know exactly what the engine reads.
#
# Example: C:\SEBackup\instances\PvPArena.toml
# =============================================================================
#
# TOML ordering note: the operational keys below (run_mode, world_path,
# staging_path, share_name) are TOP-LEVEL keys and MUST appear before any
# [table] header. In TOML, a bare key written after a "[section]" header
# belongs to that section -- so these keys cannot be moved underneath
# [instance] or the engine will read them as missing.


# -----------------------------------------------------------------------------
# Operational keys -- read directly by the backup and restore engine.
# -----------------------------------------------------------------------------

# How the Torch server runs on the node: "service" (Windows service) or
# "console" (launched manually / in a console window). Controls how SEBackup
# stops and starts the server during a restore. Defaults to "service".
run_mode = "service"

# Absolute path to the world save data directory on the compute node.
# This is the folder that contains Sandbox.sbc. It is the data SEBackup
# snapshots, archives, and restores. REQUIRED.
world_path = "C:\\TorchServers\\PvPArena\\Instance\\Saves\\PvPWorld"

# Absolute path on the node used as the local staging area for this instance
# (the world is copied here from the VSS snapshot, then compressed).
# If omitted, the engine falls back to "C:\SEBackup\staging".
staging_path = "D:\\SEBackup\\staging\\PvPArena"

# Name of the SMB share on the node that exposes the staging directory so the
# C&C can pull finished archives. Must match the share created during
# registration (typically "SEBackup_{instance}$"). REQUIRED.
share_name = "SEBackup_PvPArena$"

# Optional: the Windows service name (run_mode = "service"). If omitted, the
# engine assumes "TorchServer_{instance_name}".
# service_name = "TorchServer_PvPArena"

# Optional: the process image name to wait on when stopping a console-mode
# server. If omitted, the engine assumes "Torch.Server".
# process_name = "Torch.Server"


# -----------------------------------------------------------------------------
# [instance] - Instance identity and metadata
# -----------------------------------------------------------------------------
[instance]

# Internal name for this instance. Should match the filename stem.
# Used as the identifier in backup manifests, logs, and directory names.
name = "PvPArena"

# Human-readable display name for logs, notifications, and the GUI.
display_name = "PvP Arena Server"

# Optional description for documentation purposes.
description = "24/7 PvP arena server with weekly resets"


# -----------------------------------------------------------------------------
# [vrage_api] - VRage Remote API connection for this instance
# -----------------------------------------------------------------------------
# Used to flush the world to disk before snapshotting, and to ping the server
# after a restore. Overrides the global [defaults.vrage_api] settings.
[vrage_api]

# TCP port for the VRage Remote API on this instance.
# Each Torch instance on a node typically runs on a different port.
port = 8080

# VRage Remote API security key (Base64 "Remote API" key from the Torch server's
# SpaceEngineers-Dedicated.cfg). Used to authenticate save/ping requests.
# NOTE: the key is named "security_key" here -- that is what the engine reads.
security_key = ""

# Optional: seconds to wait for a world save to complete. Override for very
# large worlds. Leave commented to use the global default (120 seconds).
# save_timeout_seconds = 180


# -----------------------------------------------------------------------------
# [torch] - Informational install paths (optional, not required by the engine)
# -----------------------------------------------------------------------------
# Recorded by Register-Instance.ps1 for reference / future tooling. The engine
# operates on world_path above, not on these.
# [torch]
# install_path = "C:\\TorchServers\\PvPArena"
# data_root    = "C:\\TorchServers\\PvPArena\\Instance"
