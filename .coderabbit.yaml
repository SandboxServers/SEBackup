# CodeRabbit Configuration for SEBackup
# Space Engineers Torch Server Backup & Restore System (PowerShell 7)
# C&C system managing VSS-based backups across remote Windows compute nodes
# via WinRM/PSRemoting, with DPAPI-encrypted credentials and a WPF dashboard.

language: en-US
early_access: false
enable_free_tier: true
inheritance: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  commit_status: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  abort_on_close: true
  disable_cache: false

  slop_detection:
    enabled: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    drafts: false

  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true
    simplify:
      enabled: false

  pre_merge_checks:
    override_requested_reviewers_only: false
    docstrings:
      mode: warning
      threshold: 80
    title:
      mode: warning
    description:
      mode: warning
    issue_assessment:
      mode: warning

  # Tool configuration focused on PowerShell + security-sensitive infrastructure
  tools:
    # PowerShell static analysis (PSScriptAnalyzer) — primary linter for this repo
    psscriptanalyzer:
      enabled: true

    # Security scanning — this project handles DPAPI credentials and remote
    # execution, so secret/credential leakage detection is a priority.
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    semgrep:
      enabled: true

    # Configuration and documentation validation
    yamllint:
      enabled: true
    markdownlint:
      enabled: true

    # GitHub-native checks
    github-checks:
      enabled: true
      timeout_ms: 90000

    # Disabled: Not applicable to this PowerShell project
    shellcheck:
      enabled: false
    clippy:
      enabled: false
    cppcheck:
      enabled: false
    clang:
      enabled: false
    ruff:
      enabled: false
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    rubocop:
      enabled: false
    golangci-lint:
      enabled: false
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    flake8:
