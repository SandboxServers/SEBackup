    # ast-grep block intentionally omitted — its schema only accepts rule_dirs,
    # util_dirs, essential_rules, and packages; an `enabled: false` here
    # violates the schema. CodeRabbit defaults ast-grep to off when the section
    # is absent, which is what we want.

  # Path-specific review rules reflecting the conventions in CLAUDE.md
  path_instructions:
    # All sub-modules — enforce the project's module structure and style rules
    - path: Modules/**
      instructions: |
        Enforce SEBackup module conventions:
        - One function per file; the file name MUST match the function name.
        - Public/ functions are exported and use the `Verb-SEBNoun` naming
          (SEB prefix, approved PowerShell verb). Private/ functions are
          internal and do NOT carry the SEB prefix.
        - Every public function has [CmdletBinding()], [Parameter()] attributes,
          comment-based help (.SYNOPSIS/.DESCRIPTION/.PARAMETER/.EXAMPLE/.OUTPUTS),
          and [OutputType()] where the return type is known.
        - Wrap fallible operations (file I/O, remote calls, API requests) in
          try/catch with `-ErrorAction Stop`; log failures via
          `Write-SEBLog -Level ERROR`. Never silently swallow errors.
        - Use `Write-SEBLog` for output, never `Write-Host` in module code.
        - Use full cmdlet names, never aliases (Get-ChildItem not gci).
        - Module-scoped variables use the `$script:` scope modifier.

    # VSS / shadow-copy lifecycle — leaks here orphan snapshots on nodes
    - path: Modules/VSSManager/**
      instructions: |
        Focus on Volume Shadow Copy safety:
        - Every shadow copy MUST be cleaned up in a `finally` block, even on
          failure. Prefer `Invoke-SEBWithShadowCopy`, which manages the lifecycle.
        - Verify no code path can return/throw before cleanup runs.
        - Orphan cleanup paths (`Clear-SEBOrphanShadowCopies`) must be robust.

    # Credential handling — strictest security review
    - path: Modules/CredentialManager/**
      instructions: |
        Focus on credential security:
        - Node passwords are protected with System.Security.Cryptography.ProtectedData
          using DataProtectionScope.LocalMachine + per-machine entropy, stored Base64
          inside the {NodeName}.cred JSON envelope. Binding is machine-only (NOT
          machine-and-user) by design so S4U scheduled tasks can decrypt. The legacy
          Export-Clixml .cred.xml (CurrentUser DPAPI) format is read only by the
          migration path.
        - Never store, log, or echo plaintext passwords or secrets anywhere.
        - The file ACL (SYSTEM + Administrators + saving account; Users removed) is the
          local confidentiality boundary; do not weaken it or introduce portable
          plaintext fallbacks.

    # Remote execution — must go through the wrapper, not raw Invoke-Command
    - path: Modules/RemoteManager/**
      instructions: |
        Focus on remote execution correctness:
        - Remote operations MUST use `Invoke-SEBRemoteCommand` (retry, session
          management, logging) — never raw `Invoke-Command`.
        - Sessions are created with `New-SEBSession` and always cleaned up with
          `Remove-SEBSession`. Check connectivity via `Test-SEBConnection` first.

    # Backup/restore orchestration — data-integrity critical
    - path: Modules/{BackupEngine,RestoreEngine,IntegrityManager,ManifestManager}/**
      instructions: |
        Focus on data integrity and orchestration correctness:
        - Restores must never corrupt or partially overwrite live instance data
          without a verified manifest and integrity check.
        - Validate manifest/checksum handling and the three-tier storage flow
          (node staging -> C&C local -> NAS offload).
        - Ensure lock files are acquired and released so concurrent backups of
          the same instance cannot collide.

    # TOML configuration files
    - path: Config/**
      instructions: |
        Focus on configuration safety:
        - Configs are TOML, parsed via PSToml (ConvertFrom-Toml/ConvertTo-Toml).
        - Never commit plaintext passwords or secrets into config files.
        - Keep `*.example.toml` files in sync with documented options.

    # Pester tests
    - path: Tests/**
      instructions: |
        Focus on Pester v5 conventions:
        - Test files are named `{FunctionName}.Tests.ps1` or
          `{ModuleName}.Tests.ps1` under Tests/{ModuleName}/.
        - Prefer mocking remote/VSS/filesystem side effects so tests stay
          hermetic and do not touch real nodes or shadow copies.

    # WPF dashboard
    - path: GUI/**
      instructions: |
        Focus on WPF correctness:
        - UI updates from background work must marshal back to the dispatcher
          thread; never mutate UI elements from a non-UI thread.
        - Keep long-running backup/restore calls off the UI thread to avoid
          freezing the dashboard.

    # Files deployed to remote compute nodes
    - path: NodeAgent/**
      instructions: |
        Focus on node-agent portability:
        - Code runs on remote compute nodes, possibly without the C&C modules
          available — keep dependencies minimal and self-contained.
        - Maintain PowerShell 7.0+ compatibility.

chat:
  art: true
  allow_non_org_members: true
  auto_reply: true
  integrations:
    jira:
      usage: auto
    linear:
      usage: auto

knowledge_base:
  opt_out: false
  web_search:
    enabled: false
  code_guidelines:
    enabled: true
    # Point at guideline documents so CodeRabbit learns project conventions.
    filePatterns:
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "**/CONTRIBUTING.md"
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto

code_generation:
  docstrings:
    language: en-US
  unit_tests:
    path_instructions:
      - path: "Modules/**"
        instructions: "Write Pester v5 tests; mock remote (WinRM), VSS, and filesystem side effects so tests are hermetic."
